          { label: "E — Опытным врачом-специалистом или заведующим клиникой", category: "Медицина" }
        ]
      }
    ];

    // --- СЕРВИС ХРАНИЛИЩА (LOCALSTORAGE) ---
    const StorageService = {
      getUniversities: () => {
        const stored = localStorage.getItem("ug_universities");
        if (!stored) {
          localStorage.setItem("ug_universities", JSON.stringify(INITIAL_UNIVERSITIES));
          return INITIAL_UNIVERSITIES;
        }
        return JSON.parse(stored);
      },
      saveUniversities: (data) => {
        localStorage.setItem("ug_universities", JSON.stringify(data));
      },
      getSpecialties: () => INITIAL_SPECIALTIES,
      getFavorites: () => {
        const f = localStorage.getItem("ug_favorites");
        return f ? JSON.parse(f) : { universities: [], specialties: [] };
      },
      saveFavorites: (data) => {
        localStorage.setItem("ug_favorites", JSON.stringify(data));
      },
      getCompareList: () => {
        const c = localStorage.getItem("ug_compare");
        return c ? JSON.parse(c) : [];
      },
      saveCompareList: (data) => {
        localStorage.setItem("ug_compare", JSON.stringify(data));
      },
      getUser: () => {
        const u = localStorage.getItem("ug_user");
        return u ? JSON.parse(u) : null;
      },
      saveUser: (user) => {
        localStorage.setItem("ug_user", JSON.stringify(user));
      },
      removeUser: () => {
        localStorage.removeItem("ug_user");
      },
      getQuizResult: () => {
        const q = localStorage.getItem("ug_quiz_result");
        return q ? JSON.parse(q) : null;
      },
      saveQuizResult: (res) => {
        localStorage.setItem("ug_quiz_result", JSON.stringify(res));
      }
    };

    // --- ОБЩИЕ UI КОМПОНЕНТЫ ---
    const Badge = ({ children, color = "blue" }) => {
      const colors = {
        blue: "bg-brand-50 text-brand-700 border-brand-200",
        green: "bg-emerald-50 text-emerald-700 border-emerald-200",
        purple: "bg-purple-50 text-purple-700 border-purple-200",
        amber: "bg-amber-50 text-amber-700 border-amber-200"
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${colors[color] || colors.blue}`}>
          {children}
        </span>
      );
    };

    const DemoAlert = () => (
      <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg my-4 flex items-start gap-3">
        <Icon name="alert-circle" size={20} className="text-amber-600 mt-0.5" />
        <div className="text-xs text-amber-800 leading-relaxed">
          <strong>Внимание (Демонстрационные данные):</strong> Тарифы, проходные баллы и списки программ приведены в качестве демонстрации функционала платформы UniGuide KZ. Всегда сверяйте актуальную информацию на официальных сайтах вузов и Национального центра тестирования (НЦТ).
        </div>
      </div>
    );

    // --- ГЛАВНОЕ ПРИЛОЖЕНИЕ ---
    function App() {
      // Маршрутизация (Hash-based для надежной работы на GitHub Pages без серверных перенаправлений)
      const [currentRoute, setCurrentRoute] = useState(window.location.hash || "#/");
      const [universities, setUniversities] = useState(StorageService.getUniversities);
      const [favorites, setFavorites] = useState(StorageService.getFavorites);
      const [compareList, setCompareList] = useState(StorageService.getCompareList);
      const [user, setUser] = useState(StorageService.getUser);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [notification, setNotification] = useState(null);

      // Глобальный поиск
      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");

      useEffect(() => {
        const handleHashChange = () => {
          setCurrentRoute(window.location.hash || "#/");
          window.scrollTo(0, 0);
          setMobileMenuOpen(false);
        };
        window.addEventListener("hashchange", handleHashChange);
        return () => window.removeEventListener("hashchange", handleHashChange);
      }, []);

      const showNotify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const toggleFavoriteUniversity = (id) => {
        const next = { ...favorites };
        if (next.universities.includes(id)) {
          next.universities = next.universities.filter(x => x !== id);
          showNotify("Удалено из избранного");
        } else {
          next.universities.push(id);
          showNotify("Добавлено в избранное ❤️");
        }
        setFavorites(next);
        StorageService.saveFavorites(next);
      };

      const toggleFavoriteSpecialty = (id) => {
        const next = { ...favorites };
        if (next.specialties.includes(id)) {
          next.specialties = next.specialties.filter(x => x !== id);
          showNotify("Удалено из избранных специальностей");
        } else {
          next.specialties.push(id);
          showNotify("Специальность сохранена ❤️");
        }
        setFavorites(next);
        StorageService.saveFavorites(next);
      };

      const toggleCompare = (id) => {
        let next = [...compareList];
        if (next.includes(id)) {
          next = next.filter(x => x !== id);
          showNotify("Удалено из сравнения");
        } else {
          if (next.length >= 3) {
            alert("Вы можете одновременно сравнивать не более 3 университетов.");
            return;
          }
          next.push(id);
          showNotify("Добавлено к сравнению ⚖️");
        }
        setCompareList(next);
        StorageService.saveCompareList(next);
      };

      const clearCompare = () => {
        setCompareList([]);
        StorageService.saveCompareList([]);
        showNotify("Список сравнения очищен");
      };

      // Роутинг параметров (например, #/universities/nu)
      const routeParts = currentRoute.replace("#/", "").split("/");
      const rootPath = routeParts[0] || "";
      const pathParam = routeParts[1] || "";

      return (
        <div className="flex flex-col min-h-screen">
          {/* Notification Toast */}
          {notification && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 border border-slate-700 animate-bounce">
              <Icon name="check-circle" size={18} className="text-emerald-400" />
              <span className="text-sm font-medium">{notification}</span>
            </div>
          )}

          {/* НАВБАР */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-20">
                {/* Logo */}
                <a href="#/" className="flex items-center gap-3 group">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <Icon name="graduation-cap" size={24} className="text-white" />
                  </div>
                  <div>
                    <span className="text-xl font-bold tracking-tight text-slate-900 group-hover:text-brand-600 transition-colors">UniGuide</span>
                    <span className="text-xs ml-1 font-extrabold text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded border border-brand-200">KZ</span>
                  </div>
                </a>

                {/* Desktop Menu */}
                <nav className="hidden md:flex items-center space-x-1 lg:space-x-2">
                  <a href="#/" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${rootPath === "" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>Главная</a>
                  <a href="#/universities" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${rootPath === "universities" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>Университеты</a>
                  <a href="#/specialties" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${rootPath === "specialties" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>Специальности</a>
                  <a href="#/compare" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 ${rootPath === "compare" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>
                    Сравнение
                    {compareList.length > 0 && (
                      <span className="bg-brand-600 text-white text-xs px-1.5 py-0.2 rounded-full font-bold">{compareList.length}</span>
                    )}
                  </a>
                  <a href="#/calculator" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${rootPath === "calculator" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>Калькулятор</a>
                  <a href="#/quiz" className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${rootPath === "quiz" ? "text-brand-600 bg-brand-50" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"}`}>Тест</a>
                </nav>

                {/* Right Actions */}
                <div className="hidden md:flex items-center space-x-3">
                  <button 
                    onClick={() => setGlobalSearchOpen(true)}
                    className="p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors"
                    title="Быстрый поиск"
                  >
                    <Icon name="search" size={20} />
                  </button>

                  <a 
                    href="#/favorites" 
                    className="relative p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
                    title="Избранное"
                  >
                    <Icon name="heart" size={20} />
                    {(favorites.universities.length + favorites.specialties.length) > 0 && (
                      <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
                    )}
                  </a>

                  {user ? (
                    <div className="flex items-center gap-2">
                      <a href="#/profile" className="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-100 text-sm font-semibold text-slate-800">
                        <div className="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-bold uppercase">
                          {user.name.slice(0, 2)}
                        </div>
                        <span className="max-w-[100px] truncate">{user.name}</span>
                      </a>
                      {user.role === 'admin' && (
                        <a href="#/admin" className="p-2 text-slate-500 hover:text-brand-600 rounded-lg" title="Админ-панель">
                          <Icon name="shield-check" size={20} />
                        </a>
                      )}
                    </div>
                  ) : (
                    <a href="#/login" className="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl transition-all shadow-sm shadow-brand-500/30">
                      <Icon name="log-in" size={16} />
                      Войти
                    </a>
                  )}
                </div>

                {/* Mobile hamburger */}
                <div className="flex md:hidden items-center gap-2">
                  <button 
                    onClick={() => setGlobalSearchOpen(true)}
                    className="p-2 text-slate-600 rounded-lg"
                  >
                    <Icon name="search" size={20} />
                  </button>
                  <button 
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="p-2 text-slate-600 rounded-lg hover:bg-slate-100"
                  >
                    <Icon name={mobileMenuOpen ? "x" : "menu"} size={24} />
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Navigation Drawer */}
            {mobileMenuOpen && (
              <div className="md:hidden border-t border-slate-200 bg-white px-4 pt-3 pb-6 space-y-2">
                <a href="#/" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Главная</a>
                <a href="#/universities" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Университеты</a>
                <a href="#/specialties" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Специальности</a>
                <a href="#/compare" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">
                  Сравнение {compareList.length > 0 && `(${compareList.length})`}
                </a>
                <a href="#/calculator" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Калькулятор поступления</a>
                <a href="#/quiz" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Тест направлений</a>
                <a href="#/favorites" className="block px-3 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Избранное</a>
                {user ? (
                  <>
                    <a href="#/profile" className="block px-3 py-2 rounded-lg text-base font-medium text-brand-600 bg-brand-50">Личный кабинет ({user.name})</a>
                    {user.role === "admin" && (
                      <a href="#/admin" className="block px-3 py-2 rounded-lg text-base font-medium text-purple-700 bg-purple-50">Панель администратора</a>
                    )}
                  </>
                ) : (
                  <a href="#/login" className="block text-center mt-3 px-4 py-2.5 rounded-xl font-semibold text-white bg-brand-600">Войти в аккаунт</a>
                )}
              </div>
            )}
          </header>

          {/* ГЛОБАЛЬНЫЙ ПОИСК МОДАЛКА С DEBOUNCE */}
          {globalSearchOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-start justify-center pt-20 px-4">
              <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden border border-slate-200">
                <div className="p-4 border-b border-slate-100 flex items-center gap-3">
                  <Icon name="search" size={20} className="text-slate-400" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Быстрый поиск: 'Право', 'Астана', 'NU', 'IT'..."
                    className="w-full text-base focus:outline-none text-slate-800 placeholder-slate-400"
                    autoFocus
                  />
                  <button 
                    onClick={() => { setGlobalSearchOpen(false); setSearchQuery(""); }}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="max-h-96 overflow-y-auto p-4 space-y-4">
                  {searchQuery.trim() === "" ? (
                    <div className="text-center py-8 text-sm text-slate-400">
                      Введите название вуза, специальности, предмета или города для мгновенного поиска.
                    </div>
                  ) : (
                    <div>
                      {/* Университеты */}
                      <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Университеты</div>
                      {universities.filter(u => 
                        u.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        u.city.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        u.shortName.toLowerCase().includes(searchQuery.toLowerCase())
                      ).length === 0 ? (
                        <div className="text-xs text-slate-400 mb-4">Ничего не найдено среди вузов</div>
                      ) : (
                        <div className="space-y-1 mb-4">
                          {universities
                            .filter(u => 
                              u.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              u.city.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              u.shortName.toLowerCase().includes(searchQuery.toLowerCase())
                            )
                            .slice(0, 4)
                            .map(u => (
                              <a
                                key={u.id}
                                href={`#/universities/${u.id}`}
                                onClick={() => setGlobalSearchOpen(false)}
                                className="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 transition-colors"
                              >
                                <div>
                                  <div className="text-sm font-semibold text-slate-900">{u.name}</div>
                                  <div className="text-xs text-slate-500">{u.city} • {u.type}</div>
                                </div>
                                <Icon name="chevron-right" size={16} className="text-slate-400" />
                              </a>
                            ))}
                        </div>
                      )}

                      {/* Специальности */}
                      <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Специальности</div>
                      {StorageService.getSpecialties().filter(s => 
                        s.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        s.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        s.subjects.toLowerCase().includes(searchQuery.toLowerCase())
                      ).length === 0 ? (
                        <div className="text-xs text-slate-400">Ничего не найдено среди специальностей</div>
                      ) : (
                        <div className="space-y-1">
                          {StorageService.getSpecialties()
                            .filter(s => 
                              s.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              s.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.subjects.toLowerCase().includes(searchQuery.toLowerCase())
                            )
                            .slice(0, 4)
                            .map(s => (
                              <a
                                key={s.id}
                                href={`#/specialties`}
                                onClick={() => setGlobalSearchOpen(false)}
                                className="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 transition-colors"
                              >
                                <div>
                                  <div className="text-sm font-semibold text-slate-900">{s.title}</div>
                                  <div className="text-xs text-slate-500">Предметы ЕНТ: {s.subjects}</div>
                                </div>
                                <Icon name="arrow-up-right" size={16} className="text-slate-400" />
                              </a>
                            ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ОСНОВНОЙ КОНТЕНТ (РОУТЕР) */}
          <main className="flex-1">
            {rootPath === "" && (
              <HomePage 
                universities={universities} 
                favorites={favorites} 
                compareList={compareList} 
                onToggleFav={toggleFavoriteUniversity}
                onToggleCompare={toggleCompare}
              />
            )}
            {rootPath === "universities" && !pathParam && (
              <UniversitiesCatalogPage 
                universities={universities} 
                favorites={favorites} 
                compareList={compareList} 
                onToggleFav={toggleFavoriteUniversity}
                onToggleCompare={toggleCompare}
              />
            )}
            {rootPath === "universities" && pathParam && (
              <UniversityDetailPage 
                id={pathParam} 
                universities={universities}
                favorites={favorites}
                compareList={compareList}
                onToggleFav={toggleFavoriteUniversity}
                onToggleCompare={toggleCompare}
                onUpdateUniversity={(updated) => {
                  const next = universities.map(u => u.id === updated.id ? updated : u);
                  setUniversities(next);
                  StorageService.saveUniversities(next);
                  showNotify("Фото и данные университета обновлены!");
                }}
              />
            )}
            {rootPath === "specialties" && (
              <SpecialtiesPage 
                favorites={favorites} 
                onToggleFav={toggleFavoriteSpecialty} 
              />
            )}
            {rootPath === "compare" && (
              <ComparePage 
                compareList={compareList} 
                universities={universities} 
                onRemoveCompare={toggleCompare} 
                onClearCompare={clearCompare} 
              />
            )}
            {rootPath === "calculator" && (
              <CalculatorPage universities={universities} />
            )}
            {rootPath === "quiz" && (
              <QuizPage onResultSave={(res) => {
                StorageService.saveQuizResult(res);
                showNotify("Результаты теста сохранены!");
              }} />
            )}
            {rootPath === "favorites" && (
              <FavoritesPage 
                favorites={favorites} 
                universities={universities} 
                specialties={StorageService.getSpecialties()}
                onToggleFavUni={toggleFavoriteUniversity}
                onToggleFavSpec={toggleFavoriteSpecialty}
              />
            )}
            {rootPath === "login" && (
              <AuthPage 
                onLogin={(userData) => {
                  setUser(userData);
                  StorageService.saveUser(userData);
                  window.location.hash = "#/profile";
                }} 
              />
            )}
            {rootPath === "profile" && (
              <ProfilePage 
                user={user} 
                onLogout={() => {
                  setUser(null);
                  StorageService.removeUser();
                  window.location.hash = "#/";
                }}
                universities={universities}
                specialties={StorageService.getSpecialties()}
                favorites={favorites}
              />
            )}
            {rootPath === "admin" && (
              <AdminPage 
                universities={universities} 
                onSaveUniversities={(data) => {
                  setUniversities(data);
                  StorageService.saveUniversities(data);
                  showNotify("Изменения сохранены в базе!");
                }}
              />
            )}
            {!["", "universities", "specialties", "compare", "calculator", "quiz", "favorites", "login", "profile", "admin"].includes(rootPath) && (
              <NotFoundPage />
            )}
          </main>

          {/* ПОДВАЛ */}
          <footer className="bg-slate-900 text-slate-400 text-sm mt-20 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-10">
                <div className="space-y-4">
                  <div className="flex items-center gap-2 text-white font-bold text-lg">
                    <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
                      <Icon name="graduation-cap" size={20} className="text-white" />
                    </div>
                    <span>UniGuide KZ</span>
                  </div>
                  <p className="text-slate-400 text-xs leading-relaxed">
                    «Твой путь в университет начинается здесь.» Все необходимое для поступления в вузы Казахстана в едином технологичном решении.
                  </p>
                  <div className="text-xs text-slate-500">
                    © 2026 UniGuide KZ. Все права защищены.
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-semibold mb-4 text-xs uppercase tracking-wider">Платформа</h4>
                  <ul className="space-y-2.5 text-xs">
                    <li><a href="#/universities" className="hover:text-white transition-colors">Каталог университетов</a></li>
                    <li><a href="#/specialties" className="hover:text-white transition-colors">Специальности и гранты</a></li>
                    <li><a href="#/compare" className="hover:text-white transition-colors">Сравнение вузов</a></li>
                    <li><a href="#/calculator" className="hover:text-white transition-colors">Калькулятор шансов</a></li>
                    <li><a href="#/quiz" className="hover:text-white transition-colors">Профориентационный тест</a></li>
                  </ul>

    function UniversitiesCatalogPage({ universities, favorites, compareList, onToggleFav, onToggleCompare }) {
      const [filterCity, setFilterCity] = useState("all");

      const [onlyGrants, setOnlyGrants] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("rating");

      const filtered = useMemo(() => {
        return universities.filter(u => {
          if (filterCity !== "all" && u.city !== filterCity) return false;
          if (filterType !== "all" && !u.type.toLowerCase().includes(filterType.toLowerCase())) return false;
          if (filterLanguage !== "all" && !u.language.toLowerCase().includes(filterLanguage.toLowerCase())) return false;
          if (onlyGrants && !u.hasGrants) return false;
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            const matchName = u.name.toLowerCase().includes(q) || u.shortName.toLowerCase().includes(q);
            const matchCity = u.city.toLowerCase().includes(q);
            if (!matchName && !matchCity) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "name") return a.name.localeCompare(b.name);
          if (sortBy === "programs") return b.programsCount - a.programsCount;
          return 0;
        });
      }, [universities, filterCity, filterType, filterLanguage, onlyGrants, searchQuery, sortBy]);

    // ==========================================
    // 7. ПРОФОРИЕНТАЦИОННЫЙ ТЕСТ (10 ВОПРОСОВ)
    // ==========================================
    function QuizPage({ onResultSave }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [finished, setFinished] = useState(false);

      const handleSelectOption = (category) => {
        const nextAnswers = { ...answers, [currentQ]: category };
        setAnswers(nextAnswers);

        if (currentQ < QUIZ_QUESTIONS.length - 1) {
          setCurrentQ(currentQ + 1);
        } else {
          setFinished(true);
          // Подсчет преобладающей категории
          const counts = {};
          Object.values(nextAnswers).forEach(cat => {
            counts[cat] = (counts[cat] || 0) + 1;
          });
          const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
          const topCategory = sorted[0] ? sorted[0][0] : "IT";
          onResultSave({ topCategory, date: new Date().toLocaleDateString() });
        }
      };

      const restart = () => {
        setAnswers({});
        setCurrentQ(0);
        setFinished(false);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-slate-900">Тест: Какое направление тебе подходит?</h1>
            <p className="text-sm text-slate-500 mt-1">Ответьте на 10 простых вопросов и узнайте сферу, близкую к вашим интересам.</p>
          </div>

          <div className="bg-slate-100 p-4 rounded-xl text-xs text-slate-600">
            <strong>Обратите внимание:</strong> Результат теста носит исключительно ознакомительный характер, не является психологическим диагнозом или окончательной рекомендацией.
          </div>

          {!finished ? (
            <div className="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
              <div className="flex justify-between items-center text-xs font-semibold text-slate-400">
                <span>Вопрос {currentQ + 1} из {QUIZ_QUESTIONS.length}</span>
                <span>{Math.round(((currentQ + 1) / QUIZ_QUESTIONS.length) * 100)}%</span>
              </div>

              {/* Progress bar */}
              <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div 
                  className="bg-brand-600 h-full transition-all duration-300" 
                  style={{ width: `${((currentQ + 1) / QUIZ_QUESTIONS.length) * 100}%` }}
                ></div>
              </div>

              <h2 className="text-lg font-bold text-slate-900 pt-2">
                {QUIZ_QUESTIONS[currentQ].question}
              </h2>

              <div className="space-y-3">
                {QUIZ_QUESTIONS[currentQ].options.map((opt, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSelectOption(opt.category)}
                    className="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition text-sm font-medium text-slate-800 flex items-center justify-between group"
                  >
                    <span>{opt.label}</span>
                    <Icon name="arrow-right" size={16} className="text-slate-300 group-hover:text-brand-600 group-hover:translate-x-1 transition-all" />
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-6 shadow-sm">
              <div className="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto">
                <Icon name="award" size={32} />
              </div>
              <div>
                <span className="text-xs uppercase font-bold tracking-wider text-brand-600">Ваш результат</span>
                <h2 className="text-2xl font-extrabold text-slate-900 mt-1">Рекомендованное направление определено</h2>
              </div>

              <p className="text-sm text-slate-600 max-w-lg mx-auto leading-relaxed">
                На основе ваших выборов вам наиболее близки программы кластера: <strong>IT и Информационные технологии</strong>, а также аналитические специальности.
              </p>

              <div className="flex justify-center gap-3 pt-4">
                <a
                  href="#/specialties"
                  className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs transition"
                >
                  Посмотреть специальности
                </a>
                <button
                  onClick={restart}
                  className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-xs transition"
                >
                  Пройти заново
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

      const [list, setList] = useState(universities);

      const [editItem, setEditItem] = useState(null);

      // Форма добавления/редактирования

      const [city, setCity] = useState("Астана");
      const [type, setType] = useState("Национальный");
      const [photo, setPhoto] = useState("");

        setEditItem(null);

        setName(uni.name);

        setPhoto(uni.coverPhoto);

        let next;

          next = list.map(u => u.id === editItem.id ? { ...u, name, city, type, coverPhoto: photo } : u);
        } else {
          const newUni = {
            id: "uni_" + Date.now(),
            name,
            shortName: name.slice(0, 4),
            city,
            type,
            rating: 4.8,
            programsCount: 20,
            hasGrants: true,
            costEstimate: "Демо: от 1 000 000 ₸",
            language: "Казахский, Русский",
            studyFormat: "Очная",
            description: "Новый университет, добавленный через админ-панель платформы.",
            coverPhoto: photo || "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1000&q=80",
            address: `г. ${city}`,
            website: "https://example.kz",
            phone: "+7 (777) 000-00-00",
            programs: ["IT", "Менеджмент"],
            admissionReqs: "ЕНТ",
            isDemo: true

          next = [newUni, ...list];

            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

                  <div>
                    <label className="font-semibold block mb-1">Тип учреждения:</label>
                    <input type="text" value={type} onChange={e => setType(e.target.value)} required className="w-full p-2.5 border rounded-xl" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">URL фото / обложки:</label>
                    <input type="text" value={photo} onChange={e => setPhoto(e.target.value)} className="w-full p-2.5 border rounded-xl" />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 border rounded-xl">Отмена</button>
                    <button type="submit" className="px-4 py-2 bg-brand-600 text-white rounded-xl font-bold">Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 12. FAQ АККОРДЕОН
    // ==========================================
    function FAQAccordion() {
      const [openIdx, setOpenIdx] = useState(null);
      const faqs = [
        { q: "Как пользоваться платформой UniGuide KZ?", a: "Вы можете искать вузы через глобальный поиск, фильтровать каталог по городам и наличию грантов, сравнивать до 3-х университетов в сравнительной таблице и сохранять избранные программы в один клик." },
        { q: "Где брать актуальные проходные баллы и стоимость?", a: "На платформе данные представлены в качестве демонстрационных ориентиров. Официальные и точные проходные баллы устанавливаются Министерством науки и высшего образования РК по итогам конкурса ЕНТ." },
        { q: "Можно ли доверять калькулятору шансов?", a: "Калькулятор анализирует совпадение введенного балла с пороговыми значениями прошлых лет и носит рекомендательный характер без гарантий зачисления." },
        { q: "Как работает тест направлений?", a: "Тест состоит из 10 вопросов, выявляющих склонность к определенной группе дисциплин: IT, праву, медицине, финансам или инженерии." },
        { q: "Как прикрепить собственное фото университета?", a: "Перейдите на страницу любого университета и нажмите кнопку «Прикрепить / Изменить фото» в верхнем правом углу баннера." }
      ];

      return (
        <div className="space-y-3">
          {faqs.map((f, i) => (
            <div key={i} className="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <button
                onClick={() => setOpenIdx(openIdx === i ? null : i)}
                className="w-full text-left p-4 text-sm font-bold text-slate-800 flex justify-between items-center hover:bg-slate-50 transition"
              >
                <span>{f.q}</span>
                <Icon name={openIdx === i ? "chevron-up" : "chevron-down"} size={18} className="text-slate-400" />
              </button>
              {openIdx === i && (
                <div className="p-4 pt-0 text-xs text-slate-600 leading-relaxed border-t border-slate-100 bg-slate-50/50">
                  {f.a}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // 13. СТРАНИЦА 404 (NOT FOUND)
    // ==========================================
    function NotFoundPage() {
      return (
        <div className="max-w-md mx-auto px-4 py-24 text-center space-y-4">
          <div className="text-6xl font-black text-brand-600">404</div>
          <h2 className="text-xl font-bold text-slate-800">Страница не найдена</h2>
          <p className="text-xs text-slate-500">Запрошенный раздел не существует либо ссылка устарела.</p>
          <a
            href="#/"
            className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 transition"
          >
            Вернуться на главную
          </a>
        </div>
      );
    }

    // Монтирование приложения
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
